services:
  # =========================================================================
  # 1. PayPact Backend API (FastAPI + Deterministic Policy Engine)
  # =========================================================================
  - type: web
    name: paypact-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PAYPAL_MODE
        value: mock
      - key: CORS_ORIGINS
        value: "*"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        value: ""
      - key: GEMINI_API_KEY
        sync: false

  # =========================================================================
  # 2. PayPact Frontend Web App (Next.js 14 + Aceternity UI)
  # =========================================================================
  - type: web
    name: paypact-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: BACKEND_INTERNAL_HOST
        fromService:
          type: web
          name: paypact-backend
          property: host
