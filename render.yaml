services:
  # =========================================================================
  # 1. PayPact Backend API (FastAPI + Deterministic Policy Engine)
  # =========================================================================
  - type: web
    name: paypact-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Live PayPal sandbox when the two credentials below are set; falls back to
      # the offline mock automatically when they are not.
      - key: PAYPAL_MOCK_MODE
        value: "false"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: https://paypact-frontend.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Required for POST /api/webhooks/paypal; without it the endpoint refuses deliveries
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Signs audit receipts (HMAC-SHA256); generated once by Render, never in source
      - key: APIL_SIGNING_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # =========================================================================
  # 2. PayPact Frontend Web App (Next.js 14)
  # =========================================================================
  - type: web
    name: paypact-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: "https://paypact-backend.onrender.com"
      - key: BACKEND_INTERNAL_HOST
        fromService:
          type: web
          name: paypact-backend
          property: host
